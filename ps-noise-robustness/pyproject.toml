[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps-noise-robustness"
version = "0.1.0"
description = "Noise-robustness evaluation of MediaPipe vs RTMPose hand keypoint tracking on the pronation-supination motor task"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
pipeline = [
    "mediapipe",
    "rtmlib",
    "onnxruntime-gpu",
]

[tool.setuptools.packages.find]
where = ["src"]
